[project]
name = "yt-transcribe"
version = "0.14.0"
description = "YouTube transcript extractor that reads YouTube's own captions, as a command-line tool"
requires-python = ">=3.12"
dependencies = [
    "yt-dlp>=2026.7.4",
    "click",
    "rich",
    "pyyaml",
    "tenacity",
]

[project.scripts]
yt-transcribe = "yt_transcribe.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

# yt-dlp ships no type stubs; treat as Any
[[tool.mypy.overrides]]
module = ["yt_dlp"]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.5",
    "types-pyyaml>=6.0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/yt_transcribe"]
