# Builds the plugin and publishes a GitHub Release with the BRAT/Obsidian
# install assets (manifest.json, main.js, styles.css) when a version tag is
# pushed. The tag must match the version in manifest.json with no "v" prefix.
#
# Run it by hand from the Actions tab (workflow_dispatch) to test the build
# and the plugin tests without publishing: the release step only runs on a tag.

name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Matches the @types/node major the plugin is built against.
          node-version: "22.x"

      - name: Install dependencies
        # npm install (not npm ci): the lockfile may be generated on a different
        # OS than this Linux runner, and npm ci strict-matches platform-specific
        # optional deps (esbuild/@emnapi). npm install resolves them per-platform.
        run: npm install --no-audit --no-fund

      - name: Test plugin
        run: npm test

      - name: Build plugin
        run: npm run build

      - name: Create release with plugin assets
        # Only a tag push publishes; a manual run stops after the build.
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --title="$tag" \
            --notes="Release $tag. Install with BRAT or by copying manifest.json, main.js, and styles.css into your vault's .obsidian/plugins/youtube-transcribe/ folder." \
            manifest.json main.js styles.css
